name: TestFlow API CI

on:
    push:
        branches:
         - main
    pull_request:
        branches:
         - main
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repository
              uses: actions/checkout@v4
            - name: Set env defaults
              run: |
                if [ -z "${{ secrets.DB_NAME }}" ]; then
                  echo "DB_NAME=testflow" >> $GITHUB_ENV
                else
                  echo "DB_NAME=${{ secrets.DB_NAME }}" >> $GITHUB_ENV
                fi
                echo "DB_USER=${{ secrets.DB_USER }}" >> $GITHUB_ENV
                echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
            - name: Build and start compose services
              run: |
                docker compose up -d --build
            - name: Verify Compose services
              run: | 
                docker compose ps
            - name: Check API health (retry)
              run: |
                set -e
                echo "Waiting for API to become healthy..."
                for i in $(seq 1 12); do
                  if curl --silent --fail http://localhost:8000/health; then
                    echo "API healthy"
                    exit 0
                  fi
                  echo "Attempt $i failed, sleeping 5s..."
                  sleep 5
                done
                echo "API did not become healthy after retries. Showing api logs:" >&2
                docker compose logs api --no-color --since 1m >&2 || true
                exit 1
            - name: Show Compose logs
              if : failure()
              run: | 
                docker compose logs
            - name: Stop and remove compose services
              if: always()
              run: | 
                docker compose down -v
    trivy-scan:
        name: Trivy Vulnerability Scan
        needs: [build]
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Build Docker image for scanning
              run: |
                docker build -t testflow-api:latest .
            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                image-ref: 'testflow-api:latest'
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                severity: 'CRITICAL,HIGH'
                