name: TestFlow API CI

on:
    push:
        branches:
         - main
    pull_request:
        branches:
         - main
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repository
              uses: actions/checkout@v4
            - name: Set env defaults
              run: |
                if [ -z "${{ secrets.DB_NAME }}" ]; then
                  echo "DB_NAME=testflow" >> $GITHUB_ENV
                else
                  echo "DB_NAME=${{ secrets.DB_NAME }}" >> $GITHUB_ENV
                fi
                echo "DB_USER=${{ secrets.DB_USER }}" >> $GITHUB_ENV
                echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
            - name: Build and start compose services
              run: |
                docker compose up -d --build
            - name: Verify Compose services
              run: | 
                docker compose ps
            - name: Check API health (retry)
              run: |
                set -e
                echo "Waiting for API to become healthy..."
                for i in $(seq 1 12); do
                  if curl --silent --fail http://localhost:8000/health; then
                    echo "API healthy"
                    exit 0
                  fi
                  echo "Attempt $i failed, sleeping 5s..."
                  sleep 5
                done
                echo "API did not become healthy after retries. Showing api logs:" >&2
                docker compose logs api --no-color --since 1m >&2 || true
                exit 1
            - name: Show Compose logs
              if: failure()
              run: |
                docker compose logs
            - name: Stop and remove compose services
              if: always()
              run: | 
                docker compose down -v
    trivy-scan:
        name: Trivy Vulnerability Scan
        needs: [build]
        runs-on: ubuntu-latest
        permissions:
          actions: write
          contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Build Docker image for scanning
              run: |
                docker build -t testflow-api:latest .
            - name: Run Trivy (JSON)
              run: |
                docker run --rm \
                  -v /var/run/docker.sock:/var/run/docker.sock \
                  -v "$PWD":/work \
                  -w /work \
                  aquasec/trivy:0.73.0 image --format json -o trivy-report.json testflow-api:latest || true
                cat trivy-report.json || true
            - name: Count HIGH/CRITICAL findings
              id: trivy_count
              run: |
                if ! command -v jq >/dev/null 2>&1; then
                  sudo apt-get update && sudo apt-get install -y jq
                fi
                COUNT=$(jq '[.Results[].Vulnerabilities[] | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' trivy-report.json)
                echo "count=$COUNT" >> $GITHUB_OUTPUT
            - name: Upload Trivy report artifact
              uses: actions/upload-artifact@v4
              with:
                name: trivy-report
                path: trivy-report.json
            - name: Trigger remediation workflow
              if: steps.trivy_count.outputs.count != '0'
              run: |
                echo "Found ${{ steps.trivy_count.outputs.count }} HIGH/CRITICAL findings — dispatching remediation workflow"
                curl -X POST \
                  -H "Accept: application/vnd.github.v3+json" \
                  -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  https://api.github.com/repos/${{ github.repository }}/actions/workflows/trivy-remediate.yml/dispatches \
                  -d '{"ref":"main"}'
                